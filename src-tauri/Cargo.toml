[package]
name = "nexora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "nexora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexora-core = { path = "../crates/nexora-core" }
tauri = { version = "2.12", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
uuid = "1"
tokio = { version = "1.53", features = ["rt", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.100"
