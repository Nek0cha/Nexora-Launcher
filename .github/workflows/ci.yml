name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential pkg-config libssl-dev

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format
        run: cargo fmt --all --check

      - name: Build frontend (needed by tauri-build in tests)
        run: pnpm --filter ui build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests (also regenerates TS bindings)
        run: cargo test --workspace --locked

      - name: Check generated bindings are committed
        shell: bash
        run: |
          git add -N ui/src/bindings
          git diff --exit-code -- ui/src/bindings

      - name: Frontend typecheck and tests
        run: |
          pnpm --filter ui typecheck
          pnpm --filter ui test --run

      - name: Build desktop app (no bundle)
        run: pnpm tauri build --no-bundle
